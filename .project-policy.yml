policy_profile: flat
policy_version: 1.0.19
code_paths:
  - "**/*.kt"
  - "**/*.kts"
  - "**/*.py"
  - "**/*.sh"
  - "gradle/**"
  - "app/src/**"
  - "core/src/**"
  - "cli/src/**"
  - "scripts/**"
  - "shared/testdata/**"
  - "windows/**/*.cpp"
  - "windows/**/*.hpp"
  - "windows/**/*.ps1"
  - "windows/**/*.wxs"
  - "windows/**/*.rc"
  - "windows/**/*.def"
  - "windows/assets/**"
doc_paths:
  - "README.md"
  - "docs/**"
  - "windows/README.md"
  - "windows/RELEASE_FLOW.md"
  - "windows/VALIDATION.md"
  - "windows/native/INSTALL-DIAGNOSTICS.md"
preflight:
  steps:
    - name: gradle-test
      kind: tests
      argv: ["./gradlew", "--no-daemon", ":core:check", ":cli:check", ":app:testDebugUnitTest", "assembleDebug"]
      when_path_exists: "gradlew"
      timeout_seconds: 1800
    - name: release-integrity-tests
      kind: tests
      argv: ["python3", "-m", "unittest", "discover", "-s", "scripts/tests"]
      timeout_seconds: 300
    - name: testpilot-tests
      kind: tests
      argv: ["python3", "-m", "pytest"]
      cwd: "testpilot"
      timeout_seconds: 600
tier: personal
secret_scan:
  allow: []
doc_reference:
  allow: []
agent_files:
  mode: symlink
conventions_engine:
  repo: hamanpaul/paulsha-conventions
