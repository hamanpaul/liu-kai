id: soft-popup-period
name: 長按句點彈出標點
description: '長按「.」彈出 : / & ( ) - + ; @ '' " ? ! ,，點「!」輸入；再次彈出後點彈出區以外（空白鍵）只收起、不輸入。彈出時輸入法畫面位置不變（候選列不移動）。'
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial）
preconditions:
  keyboard: soft
steps:
- id: st0
  action: ime_state
  target: EMU
- id: lp
  action: long_press_key
  target: EMU
  key: .
- id: st1
  action: ime_state
  target: EMU
- id: bang
  action: tap_key
  target: EMU
  key: popup:!
- id: lp2
  action: long_press_key
  target: EMU
  key: .
- id: out
  action: tap_key
  target: EMU
  key: space
- id: st2
  action: ime_state
  target: EMU
- id: read
  action: read_field
  target: EMU
  field: plain
pass_criteria:
- field: st1.popup
  operator: equals
  value:
  - 'popup::'
  - popup:/
  - popup:&
  - popup:(
  - popup:)
  - popup:-
  - popup:+
  - popup:;
  - popup:@
  - popup:'
  - popup:"
  - popup:?
  - popup:!
  - popup:,
- field: st2.popup
  operator: equals
  value: []
- field: read.text
  operator: equals
  value: '!'
- field: st1.candidate_row_y
  operator: equals_field
  value: st0.candidate_row_y
