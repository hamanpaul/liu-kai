id: soft-language-modes
name: 左右滑動空白鍵切換語言模式（嘸／无／台／日）
description: 照官方非 PRO：中文模式空白鍵標示「◂ 嘸 ▸」，往右滑動依序切換 嘸→无→台→日→嘸、往左反向，滑動不輸入空白；依該模式的字表組字：无 z→简、台 qq→钟、日 ka,→か。輸入欄有文字時 ⎵ 改為底線（游標在開頭、後面有字也算）。英文模式滑動空白鍵仍輸入空白。
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial）
preconditions:
  keyboard: soft
steps:
- id: st0
  action: ime_state
  target: EMU
- id: r1
  action: swipe_key
  target: EMU
  key: space
  dx: 300
- id: st_sc
  action: ime_state
  target: EMU
- id: z
  action: tap_key
  target: EMU
  key: z
- id: sp1
  action: tap_key
  target: EMU
  key: space
- id: r2
  action: swipe_key
  target: EMU
  key: space
  dx: 300
- id: q1
  action: tap_key
  target: EMU
  key: q
- id: q2
  action: tap_key
  target: EMU
  key: q
- id: sp2
  action: tap_key
  target: EMU
  key: space
- id: r3
  action: swipe_key
  target: EMU
  key: space
  dx: 300
- id: st_jp
  action: ime_state
  target: EMU
- id: k
  action: tap_key
  target: EMU
  key: k
- id: a
  action: tap_key
  target: EMU
  key: a
- id: comma
  action: tap_key
  target: EMU
  key: ','
- id: sp3
  action: tap_key
  target: EMU
  key: space
- id: r4
  action: swipe_key
  target: EMU
  key: space
  dx: 300
- id: st_tr
  action: ime_state
  target: EMU
- id: l1
  action: swipe_key
  target: EMU
  key: space
  dx: -300
- id: st_back
  action: ime_state
  target: EMU
- id: r5
  action: swipe_key
  target: EMU
  key: space
  dx: 300
- id: home
  action: keys
  target: EMU
  keys:
  - MOVE_HOME
- id: st_home
  action: ime_state
  target: EMU
- id: end
  action: keys
  target: EMU
  keys:
  - MOVE_END
- id: en
  action: tap_key
  target: EMU
  key: toggle_english
- id: ea
  action: tap_key
  target: EMU
  key: a
- id: en_swipe
  action: swipe_key
  target: EMU
  key: space
  dx: 300
- id: zh
  action: tap_key
  target: EMU
  key: toggle_english
- id: read
  action: read_field
  target: EMU
  field: plain
pass_criteria:
- field: st0.row_labels
  operator: contains
  value:
  - En
  - ?123
  - ','
  - 嘸
  - .'[]
  - ↵
- field: st0.space_underline
  operator: equals
  value: false
- field: st_sc.language
  operator: equals
  value: SIMPLIFIED
- field: st_sc.row_labels
  operator: contains
  value:
  - En
  - ?123
  - ','
  - 无
  - .'[]
  - ↵
- field: st_jp.language
  operator: equals
  value: JAPANESE
- field: st_jp.row_labels
  operator: contains
  value:
  - En
  - ?123
  - ','
  - 日
  - .'[]
  - ↵
- field: st_tr.language
  operator: equals
  value: TRADITIONAL
- field: st_tr.space_underline
  operator: equals
  value: true
- field: st_back.language
  operator: equals
  value: JAPANESE
- field: st_home.language
  operator: equals
  value: TRADITIONAL
- field: st_home.space_underline
  operator: equals
  value: true
- field: read.text
  operator: equals
  value: '简钟かa '
