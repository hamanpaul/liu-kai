id: soft-language-modes
name: 長按同音切換語言模式（嘸／无／台／日）
description: 照官方：長按「同音」彈出 嘸 无 台 日 選單（目前模式以強調色標示），選取後依該模式的字表組字：无 z→简、台 qq→钟、日 ka,→か；最後切回嘸（繁中）。
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial）
preconditions:
  keyboard: soft
steps:
- id: lp
  action: long_press_key
  target: EMU
  key: homophone
- id: menu
  action: ime_state
  target: EMU
- id: sc
  action: tap_key
  target: EMU
  key: popup:lang:SIMPLIFIED
- id: st_sc
  action: ime_state
  target: EMU
- id: z
  action: tap_key
  target: EMU
  key: z
- id: sp1
  action: tap_key
  target: EMU
  key: space
- id: lp2
  action: long_press_key
  target: EMU
  key: homophone
- id: menu2
  action: ime_state
  target: EMU
- id: tw
  action: tap_key
  target: EMU
  key: popup:lang:TW_SIMPLIFIED
- id: q1
  action: tap_key
  target: EMU
  key: q
- id: q2
  action: tap_key
  target: EMU
  key: q
- id: sp2
  action: tap_key
  target: EMU
  key: space
- id: lp3
  action: long_press_key
  target: EMU
  key: homophone
- id: jp
  action: tap_key
  target: EMU
  key: popup:lang:JAPANESE
- id: k
  action: tap_key
  target: EMU
  key: k
- id: a
  action: tap_key
  target: EMU
  key: a
- id: comma
  action: tap_key
  target: EMU
  key: ','
- id: sp3
  action: tap_key
  target: EMU
  key: space
- id: lp4
  action: long_press_key
  target: EMU
  key: homophone
- id: tr
  action: tap_key
  target: EMU
  key: popup:lang:TRADITIONAL
- id: st_tr
  action: ime_state
  target: EMU
- id: read
  action: read_field
  target: EMU
  field: plain
pass_criteria:
- field: menu.popup
  operator: equals
  value:
  - popup:lang:TRADITIONAL
  - popup:lang:SIMPLIFIED
  - popup:lang:TW_SIMPLIFIED
  - popup:lang:JAPANESE
- field: st_sc.language
  operator: equals
  value: SIMPLIFIED
- field: menu2.popup
  operator: equals
  value:
  - popup:lang:TRADITIONAL
  - popup:lang:SIMPLIFIED
  - popup:lang:TW_SIMPLIFIED
  - popup:lang:JAPANESE
- field: st_tr.language
  operator: equals
  value: TRADITIONAL
- field: read.text
  operator: equals
  value: 简钟か
