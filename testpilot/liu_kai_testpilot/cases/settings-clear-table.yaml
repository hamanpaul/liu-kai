id: settings-clear-table
name: 設定頁清除字表後改用內建字表
description: 按「清除字表」清掉匯入的字表後，改用 APK 內建的字表（狀態顯示「字表：內建」）。
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial）
preconditions:
  launch: settings
mutates_table: true
steps:
- id: status0
  action: wait_text
  target: EMU
  contains: 字表：已匯入
- id: clear
  action: tap_text
  target: EMU
  text: 清除字表
  until: 已清除
- id: report
  action: wait_text
  target: EMU
  contains: 已清除
- id: status
  action: wait_text
  target: EMU
  contains: 字表：內建
pass_criteria:
- field: status.text
  operator: contains
  value: 字表：內建
- field: report.text
  operator: equals
  value: 已清除匯入的字表
