id: soft-number-row
name: 顯示數字鍵
description: 照官方「顯示數字鍵」：字母層最上方加一排 1–0，第一排字母不再有數字提示；組字中點數字列選字。
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial）
preconditions:
  keyboard: soft
  prefs:
    number_row: 'true'
steps:
- id: st1
  action: ime_state
  target: EMU
- id: a
  action: tap_key
  target: EMU
  key: a
- id: two
  action: tap_key
  target: EMU
  key: '2'
- id: read
  action: read_field
  target: EMU
  field: plain
pass_criteria:
- field: st1.rows
  operator: equals
  value:
  - - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    - '8'
    - '9'
    - '0'
  - - q
    - w
    - e
    - r
    - t
    - y
    - u
    - i
    - o
    - p
  - - a
    - s
    - d
    - f
    - g
    - h
    - j
    - k
    - l
  - - homophone
    - z
    - x
    - c
    - v
    - b
    - n
    - m
    - backspace
  - - toggle_english
    - symbols
    - ','
    - space
    - .
    - enter
- field: read.text
  operator: equals
  value: 丙
