id: hw-max-length-and-comma-root
name: 組字長度上限與標點字根
description: abcda 只保留四碼 abcd；x, 的逗號是字根。
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial）
steps:
- id: long
  action: keys
  target: EMU
  keys:
  - a
  - b
  - c
  - d
  - a
- id: st
  action: ime_state
  target: EMU
- id: space
  action: keys
  target: EMU
  keys:
  - SPACE
- id: comma
  action: keys
  target: EMU
  keys:
  - x
  - ','
  - SPACE
- id: read
  action: read_field
  target: EMU
  field: plain
pass_criteria:
- field: st.composing
  operator: equals
  value: abcd
- field: read.text
  operator: equals
  value: 和雲
