id: soft-chinese-fast-order-control
name: 中文快速輸入 40/80 ms UP 順序控制
description: 沿用既有 25 鍵中文序列，每組重複三次；逐組擷取 host 注入節奏、guest MotionEvent DOWN/UP 與 key_action/actionMs。
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial；注入事件不代表實體面板）
preconditions:
  keyboard: soft
  prefs:
    auto_cap: 'false'
    smart_keyboard: 'false'
