id: soft-voice-off
name: 語音輸入「關閉」
description: 照官方設定「語音輸入」＝關閉：英文字母層與 ?123 層都沒有 🎤（為「,」），長按「,」只有 ⚙。
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial）
preconditions:
  keyboard: soft
  prefs:
    voice: 'OFF'
steps:
- id: lp
  action: long_press_key
  target: EMU
  key: ','
- id: st_pop
  action: ime_state
  target: EMU
- id: close
  action: tap_key
  target: EMU
  key: space
- id: en
  action: tap_key
  target: EMU
  key: toggle_english
- id: st_en
  action: ime_state
  target: EMU
- id: sym
  action: tap_key
  target: EMU
  key: symbols
- id: st_sym
  action: ime_state
  target: EMU
- id: abc
  action: tap_key
  target: EMU
  key: symbols
- id: zh
  action: tap_key
  target: EMU
  key: toggle_english
pass_criteria:
- field: st_pop.popup
  operator: equals
  value:
  - popup:settings
- field: st_en.rows
  operator: contains
  value:
  - toggle_english
  - symbols
  - ','
  - space
  - .
  - enter
- field: st_sym.rows
  operator: contains
  value:
  - toggle_english
  - symbols
  - ','
  - space
  - .
  - enter
