id: settings-user-phrases
name: 加字加詞：新增、編輯、排序、刪除與儲存
description: 照官方「加字加詞」：新增拆碼與字詞（不合法的拆碼、沒有字詞時不新增），同一拆碼的字詞可上移下移調整候選順序、可編輯與刪除，儲存後輸入法查得到。
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial）
preconditions:
  launch: settings
steps:
- id: open
  action: tap_text
  target: EMU
  text: 加字加詞
  until: 沒有字詞資料
- id: nosel
  action: tap_text
  target: EMU
  text: 編輯
- id: add1
  action: tap_text
  target: EMU
  text: 新增
  until: 新增字詞
- id: c1
  action: tap_field
  target: EMU
  field: phrase_code
- id: c1t
  action: text
  target: EMU
  text: liukai
- id: t1
  action: tap_field
  target: EMU
  field: phrase_text
- id: t1k
  action: keys
  target: EMU
  keys:
  - B
  - A
  - SPACE
- id: ok1
  action: tap_text
  target: EMU
  text: 確定
  until: liukai
- id: add2
  action: tap_text
  target: EMU
  text: 新增
  until: 新增字詞
- id: c2
  action: tap_field
  target: EMU
  field: phrase_code
- id: c2t
  action: text
  target: EMU
  text: 1a
- id: ok2
  action: tap_text
  target: EMU
  text: 確定
- id: add3
  action: tap_text
  target: EMU
  text: 新增
  until: 新增字詞
- id: c3
  action: tap_field
  target: EMU
  field: phrase_code
- id: c3t
  action: text
  target: EMU
  text: ab
- id: ok3
  action: tap_text
  target: EMU
  text: 確定
- id: add4
  action: tap_text
  target: EMU
  text: 新增
  until: 新增字詞
- id: c4
  action: tap_field
  target: EMU
  field: phrase_code
- id: c4t
  action: text
  target: EMU
  text: liukai
- id: t4
  action: tap_field
  target: EMU
  field: phrase_text
- id: t4k
  action: keys
  target: EMU
  keys:
  - B
  - SPACE
- id: ok4
  action: tap_text
  target: EMU
  text: 確定
- id: up
  action: tap_text
  target: EMU
  text: 上移
- id: add5
  action: tap_text
  target: EMU
  text: 新增
  until: 新增字詞
- id: c5
  action: tap_field
  target: EMU
  field: phrase_code
- id: c5t
  action: text
  target: EMU
  text: xyz
- id: t5
  action: tap_field
  target: EMU
  field: phrase_text
- id: t5k
  action: keys
  target: EMU
  keys:
  - C
  - SPACE
- id: ok5
  action: tap_text
  target: EMU
  text: 確定
- id: edit
  action: tap_text
  target: EMU
  text: 編輯
  until: 編輯字詞
- id: e5
  action: tap_field
  target: EMU
  field: phrase_text
- id: e5k
  action: keys
  target: EMU
  keys:
  - DEL
  - B
  - SPACE
- id: ok6
  action: tap_text
  target: EMU
  text: 確定
- id: down
  action: tap_text
  target: EMU
  text: 下移
- id: del
  action: tap_text
  target: EMU
  text: 刪除
- id: sel
  action: tap_field
  target: EMU
  field: phrase:0
- id: down2
  action: tap_text
  target: EMU
  text: 下移
- id: save
  action: tap_text
  target: EMU
  text: 儲存
- id: host
  action: launch_host
  target: EMU
- id: field
  action: tap_field
  target: EMU
  field: plain
- id: win
  action: ime_window
  target: EMU
  expect: true
- id: type
  action: keys
  target: EMU
  keys:
  - L
  - I
  - U
  - K
  - A
  - I
- id: st
  action: ime_state
  target: EMU
- id: esc
  action: keys
  target: EMU
  keys:
  - ESCAPE
pass_criteria:
- field: st.candidates
  operator: equals
  value:
  - 日
  - 木
cleanup:
- action: shell
  command: run-as com.hamanpaul.liukai rm -f files/user_phrases.tsv
