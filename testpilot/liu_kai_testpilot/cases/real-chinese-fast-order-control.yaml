id: real-chinese-fast-order-control
name: 真實字表中文快速輸入 40/80 ms UP 順序控制
description: 以使用者真實字表已驗證的 ci + SPACE → 中 為基礎，每組重複 25 次；記錄實際表匯入、host 注入節奏、guest MotionEvent DOWN/UP 與 key_action/actionMs。
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial；注入事件不代表實體面板）
preconditions:
  keyboard: soft
  table: real
  prefs:
    auto_cap: 'false'
    smart_keyboard: 'false'
