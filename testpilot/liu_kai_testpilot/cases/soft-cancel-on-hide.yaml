id: soft-cancel-on-hide
name: 按住按鍵時收起鍵盤
description: 按住 b 時按 BACK 收起輸入法（輸入畫面收到 CANCEL；等收起完成再放開手指，不算按下）；之後以實體 Shift 切到英文時鍵盤立即換成英文配置（不會因為以為還有手指按著而延後重建）。
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial）
preconditions:
  keyboard: soft
steps:
- id: down
  action: touch_key
  target: EMU
  key: b
  phase: down
- id: hide
  action: keys
  target: EMU
  keys:
  - BACK
- id: hidden
  action: wait
  target: EMU
  ms: 1500
- id: release
  action: shell
  target: EMU
  command: input motionevent UP 540 1800
- id: field
  action: tap_field
  target: EMU
  field: plain
- id: win
  action: ime_window
  target: EMU
  expect: true
- id: shift
  action: keys
  target: EMU
  keys:
  - SHIFT_LEFT
- id: st
  action: ime_state
  target: EMU
- id: read
  action: read_field
  target: EMU
  field: plain
- id: back
  action: keys
  target: EMU
  keys:
  - SHIFT_LEFT
pass_criteria:
- field: st.mode
  operator: equals
  value: ENGLISH
- field: st.rows
  operator: contains
  value:
  - shift
  - z
  - x
  - c
  - v
  - b
  - n
  - m
  - backspace
- field: read.text
  operator: equals
  value: ''
