id: soft-password
name: 軟鍵盤在密碼欄直出
description: 密碼欄以軟鍵盤輸入不組字。
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial）
preconditions:
  field: password
  keyboard: soft
steps:
- id: b
  action: tap_key
  target: EMU
  key: b
- id: a
  action: tap_key
  target: EMU
  key: a
- id: st
  action: ime_state
  target: EMU
pass_criteria:
- field: st.composing
  operator: equals
  value: ''
