description: '逐格比對官方嘸蝦米 PRO「經典灰、顯示按鍵、直式按鍵高、字體適中」（使用者手機的設定）的量測值（LiuKai35：1080×2400、420dpi，2026-09-27 截圖量測）：候選列 y=1469 高 110；按鍵格高 171、排距 188、字母格寬 96、間隙 12；一般鍵漸層頂色 #8A8A8A、功能鍵 #4B4C4C（ALT 層的 ⇥ 為一般鍵）。字母、?123、ALT 三層皆比對，容差 ±4px。'
