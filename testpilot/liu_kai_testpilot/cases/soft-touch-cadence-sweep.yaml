id: soft-touch-cadence-sweep
name: 中央與 QAZ PLM 快打節奏及多指重疊
description: 同一字串對中央與外側鍵位各測 40、80、120、160、241 ms 請求間隔；每組清空 trace，保留 guest MotionEvent 時間戳與 host 注入時間，辨別注入節奏與 IME 派送。
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial）
preconditions:
  keyboard: soft
  prefs:
    auto_cap: 'false'
steps:
- id: en
  action: tap_key
  target: EMU
  key: toggle_english
- id: center-40-trace-begin
  action: touch_trace
  target: EMU
  clear: true
- id: center-40
  action: rollover
  target: EMU
  keys: [e, u, r, j, d, y]
  interval_ms: 40
  hold_ms: 120
- id: center-40-trace
  action: touch_trace
  target: EMU
- id: edge-40-trace-begin
