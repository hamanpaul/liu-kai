id: soft-root-popup
name: 中文模式長按「.'[]」彈出常用標點
description: '照官方非 PRO：中文模式的「.''[]」鍵點按為字根「.」，長按彈出與英文「.」相同的常用標點 : / & ( ) - + ; @ '' " ? ! ,；點「@」直接上屏。'
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial）
preconditions:
  keyboard: soft
steps:
- id: lp
  action: long_press_key
  target: EMU
  key: .
- id: st1
  action: ime_state
  target: EMU
- id: pick
  action: tap_key
  target: EMU
  key: popup:@
- id: st2
  action: ime_state
  target: EMU
- id: read
  action: read_field
  target: EMU
  field: plain
pass_criteria:
- field: st1.popup
  operator: equals
  value:
  - 'popup::'
  - popup:/
  - popup:&
  - popup:(
  - popup:)
  - popup:-
  - popup:+
  - popup:;
  - popup:@
  - popup:'
  - popup:"
  - popup:?
  - popup:!
  - popup:,
- field: st2.popup
  operator: equals
  value: []
- field: read.text
  operator: equals
  value: '@'
