id: soft-wildcard-homophone
name: 軟鍵盤萬用字元與同音字鍵
description: a 後切到 ?123 層按 *（萬用字元）點「天」；回字母層打 q，再到 ALT 層按 `（同音字）點「忠」；切換鍵盤層不影響組字。
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial）
preconditions:
  keyboard: soft
steps:
- id: a
  action: tap_key
  target: EMU
  key: a
- id: sym
  action: tap_key
  target: EMU
  key: symbols
- id: star
  action: tap_key
  target: EMU
  key: '*'
- id: t1
  action: tap_candidate
  target: EMU
  text: 天
- id: abc
  action: tap_key
  target: EMU
  key: symbols
- id: q
  action: tap_key
  target: EMU
  key: q
- id: sym2
  action: tap_key
  target: EMU
  key: symbols
- id: alt
  action: tap_key
  target: EMU
  key: alt
- id: g
  action: tap_key
  target: EMU
  key: '`'
- id: t2
  action: tap_candidate
  target: EMU
  text: 忠
- id: read
  action: read_field
  target: EMU
  field: plain
pass_criteria:
- field: read.text
  operator: equals
  value: 天忠
