id: soft-wildcard-homophone
name: 組字後符號頁的星號與反引號直接輸出
description: a 後進 ?123、q 後進 ALT 都取消未完成組字並切英數；* 與反引號直接上屏，不作萬用字元或同音查字，回字母層恢復中文。
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial）
preconditions:
  keyboard: soft
steps:
- id: a
  action: tap_key
  target: EMU
  key: a
- id: sym
  action: tap_key
  target: EMU
  key: symbols
- id: star
  action: tap_key
  target: EMU
  key: '*'
- id: star_state
  action: ime_state
  target: EMU
- id: abc
  action: tap_key
  target: EMU
  key: symbols
- id: q
  action: tap_key
  target: EMU
  key: q
- id: sym2
  action: tap_key
  target: EMU
  key: symbols
- id: alt
  action: tap_key
  target: EMU
  key: alt
- id: g
  action: tap_key
  target: EMU
  key: '`'
- id: alt_state
  action: ime_state
  target: EMU
- id: read
  action: read_field
  target: EMU
  field: plain
- id: letters
  action: tap_key
  target: EMU
  key: symbols
- id: restored
  action: ime_state
  target: EMU
pass_criteria:
- field: read.text
  operator: equals
  value: '*`'
- field: star_state.mode
  operator: equals
  value: ENGLISH
- field: star_state.composing
  operator: equals
  value: ''
- field: alt_state.mode
  operator: equals
  value: ENGLISH
- field: alt_state.composing
  operator: equals
  value: ''
- field: alt_state.layer
  operator: equals
  value: alt
- field: restored.mode
  operator: equals
  value: CHINESE
- field: restored.layer
  operator: equals
  value: letters
