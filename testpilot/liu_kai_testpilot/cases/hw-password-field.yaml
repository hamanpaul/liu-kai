id: hw-password-field
name: 密碼欄英數直出
description: 密碼欄不組字、單按 Shift 不切換。
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial）
preconditions:
  field: password
steps:
- id: type
  action: keys
  target: EMU
  keys:
  - b
  - a
- id: shift
  action: keys
  target: EMU
  keys:
  - SHIFT_LEFT
- id: st
  action: ime_state
  target: EMU
pass_criteria:
- field: st.composing
  operator: equals
  value: ''
- field: st.candidates
  operator: equals
  value: []
- field: st.mode
  operator: equals
  value: CHINESE
