id: soft-space-slide
name: 空白鍵左右滑動移動游標
description: 照官方：沒有組字時按住空白鍵左右滑動移動游標、不輸入空白；組字中滑動空白鍵仍是上屏首選。
topology:
  devices:
    EMU:
      role: dut
      transport: adb
      note: Android 模擬器（testbed.yaml 的 serial）
preconditions:
  keyboard: soft
steps:
- id: en
  action: tap_key
  target: EMU
  key: toggle_english
- id: a
  action: tap_key
  target: EMU
  key: a
- id: b
  action: tap_key
  target: EMU
  key: b
- id: c
  action: tap_key
  target: EMU
  key: c
- id: left
  action: swipe_key
  target: EMU
  key: space
  dx: -400
- id: x
  action: tap_key
  target: EMU
  key: x
- id: right
  action: swipe_key
  target: EMU
  key: space
  dx: 400
- id: y
  action: tap_key
  target: EMU
  key: y
- id: zh
  action: tap_key
  target: EMU
  key: toggle_english
- id: b2
  action: tap_key
  target: EMU
  key: b
- id: slide
  action: swipe_key
  target: EMU
  key: space
  dx: -200
- id: read
  action: read_field
  target: EMU
  field: plain
pass_criteria:
- field: read.text
  operator: equals
  value: xabcy木
