name: Tests

# - gradle：core／cli 單元測試與 JaCoCo 100%（行＋分支）門檻，並建置 debug APK。
# - plugin：TestPilot plugin 的 pytest 與 100% 覆蓋率門檻。
# app 的覆蓋率需要模擬器，由本機 scripts/emulator-e2e.sh 以 TestPilot 案例量測並驗證 100% 門檻。
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit tests, coverage gates and debug build
        run: ./gradlew --no-daemon :core:check :cli:check assembleDebug

  plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TestPilot core and plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install "testpilot-core @ https://github.com/hamanpaul/testpilot-core/releases/download/v0.3.9/testpilot_core-0.3.9-py3-none-any.whl"
          python -m pip install -e "testpilot[test]"

      - name: Plugin tests with 100% coverage gate
        working-directory: testpilot
        run: python -m pytest
