name: Tests

# Gradle 專案：gradlew 存在時跑 JVM 單元測試並建置 debug APK。
# 模擬器 E2E（scripts/emulator-e2e.sh）需要本機模擬器，不在 CI 執行。
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Gradle project
        id: detect
        run: |
          if [ -x gradlew ]; then
            echo "has_gradle=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gradle=false" >> "$GITHUB_OUTPUT"
            echo "No Gradle project yet; skipping."
          fi

      - name: Setup JDK 17
        if: steps.detect.outputs.has_gradle == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit tests and debug build
        if: steps.detect.outputs.has_gradle == 'true'
        run: ./gradlew --no-daemon test assembleDebug
