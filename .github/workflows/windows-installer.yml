name: Windows installer
on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'windows-v*'
permissions:
  contents: read
defaults:
  run:
    working-directory: windows
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run readings audit contract
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $canonicalBlob = & git rev-parse 'HEAD:core/src/main/resources/readings.tsv'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace([string]$canonicalBlob)) { throw 'Could not resolve canonical readings blob.' }
          $windowsBlob = & git rev-parse 'HEAD:windows/assets/readings.tsv'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace([string]$windowsBlob)) { throw 'Could not resolve Windows readings blob.' }
          if ($canonicalBlob -cne $windowsBlob) { throw 'Readings HEAD blobs are not byte-identical.' }
          python -m unittest discover -s scripts/tests -p test_audit_readings.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Readings audit tests failed.' }
          New-Item -ItemType Directory -Path 'build' -Force | Out-Null
          python scripts/audit-readings.py --repo . --report build/readings-audit.json --check
          if ($LASTEXITCODE -ne 0) { throw 'Readings audit invariant check failed.' }
      - name: Preserve readings audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readings-audit-${{ github.sha }}
          path: build/readings-audit.json
          if-no-files-found: warn
      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
      - name: Acquire and verify WiX 6.0.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $pwd 'build\toolchain'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          gh release download v6.0.2 --repo wixtoolset/wix --pattern 'wix-cli-x64.msi' --dir $tools
          if ($LASTEXITCODE -ne 0) { throw 'WiX download failed.' }
          $msi = Join-Path $tools 'wix-cli-x64.msi'
          if ((Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'a8a5cc7443353cef3ab900c60cd7a3a5ee601746319d104ac7b12ad0ced2345c') { throw 'Unexpected WiX MSI hash.' }
          $extract = Join-Path $tools 'wix6-extracted'
          New-Item -ItemType Directory -Path $extract | Out-Null
          $p = Start-Process msiexec.exe -ArgumentList @('/a', ('"'+$msi+'"'), '/qn', ('TARGETDIR="'+$extract+'"')) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WiX extraction failed: $($p.ExitCode)" }
          $wix = Join-Path $extract 'PFiles64\WiX Toolset v6.0\bin\wix.exe'
          Push-Location $tools
          try { & $wix extension add 'WixToolset.Bal.wixext/6.0.2'; if ($LASTEXITCODE -ne 0) { throw 'Burn extension download failed.' } }
          finally { Pop-Location }
          "WIX_EXE=$wix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WIX_BAL=$(Join-Path $tools '.wix\extensions\WixToolset.Bal.wixext\6.0.2\wixext6\WixToolset.BootstrapperApplications.wixext.dll')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Acquire pinned R64 MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $pwd 'build/r64-baseline'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          gh release download r64 --repo hamanpaul/liu-kai_win --pattern LiuKai.msi --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'Could not download official R64 MSI.' }
      - name: Run release preflight and WiX TLS regression
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = Join-Path '${{ steps.msys.outputs.msys2-location }}' 'mingw64\bin'
          $env:PATH = $toolchain + ';' + $env:PATH
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\native\tests\wix-installer-native-capture-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer native capture tests failed.' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\native\tests\wix-installer-scenario-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer scenario contract tests failed.' }
          & .\native\test-release.ps1 -ToolchainBin $toolchain -WorkDir "$pwd\build\release-tests" -DoctorEphemeralTestUser
          if ($LASTEXITCODE -ne 0) { throw 'Release tests failed.' }
          & .\native\tests\wix-tls-detach-tests.ps1 -ToolchainBin $toolchain -WorkDir "$pwd\build\wix-tls-test"
          if ($LASTEXITCODE -ne 0) { throw 'WiX TLS regression failed.' }
          & .\native\tests\wix-retired-files-tests.ps1 -ToolchainBin $toolchain -WorkDir "$pwd\build\wix-retired-files-test"
          if ($LASTEXITCODE -ne 0) { throw 'Retired file regression failed.' }
          foreach ($name in @('wix-legacy-recovery-policy-tests.ps1','wix-legacy-recovery-transaction-tests.ps1','wix-legacy-recovery-backup-tests.ps1','wix-legacy-recovery-registry-tests.ps1','wix-legacy-recovery-adapter-tests.ps1','wix-legacy-owner-marker-tests.ps1')) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path 'native\tests' $name)
            if ($LASTEXITCODE -ne 0) { throw "Legacy safety test failed: $name" }
          }
      - name: Preserve Doctor test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-doctor-test-diagnostics-${{ github.sha }}
          path: windows/build/release-tests/doctor/**/*.log
          if-no-files-found: warn
      - name: Build installer from Windows version and source commit
        shell: pwsh
        run: |
          $toolchain = Join-Path '${{ steps.msys.outputs.msys2-location }}' 'mingw64\bin'
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          & .\native\wix\build-platform-release.ps1 -WixExe $env:WIX_EXE -BalExtension $env:WIX_BAL -ToolchainBin $toolchain -R64Msi "$pwd\build\r64-baseline\LiuKai.msi" -OutputDir "$pwd\dist\platform" -Tag $tag
      - name: Test real installer UI bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeVersion = (Get-Content -LiteralPath "$pwd\VERSION" -Raw).Trim()
          & .\native\tests\wix-installer-ui-build-tests.ps1 `
            -WixExe $env:WIX_EXE `
            -BalExtension $env:WIX_BAL `
            -Msi "$pwd\dist\platform\wix\LiuKai.msi" `
            -MigrationBundle "$pwd\dist\platform\wix\LiuKai-win-setup.exe" `
            -GuardDll "$pwd\dist\platform\wix\LiuKaiInstallerGuard.dll" `
            -OutputDir "$pwd\build\installer-ui-build-test" `
            -RuntimeVersion $runtimeVersion
      - name: Preserve installer UI build-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-ui-build-test-${{ github.sha }}
          path: windows/build/installer-ui-build-test/
          if-no-files-found: warn
      - name: Test early failure diagnostics and staging cleanup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = Join-Path '${{ steps.msys.outputs.msys2-location }}' 'mingw64\bin'
          $env:PATH = $toolchain + ';' + $env:PATH
          & .\native\tests\wix-early-collector-tests.ps1 -ToolchainBin $toolchain -WorkDir "$pwd\build\early-diagnostic-test" -Msi "$pwd\dist\platform\wix\LiuKai.msi" -ExpectedScript "$pwd\native\collect-install-diagnostics.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Early diagnostics test failed.' }
      - name: Test locked-file MSI rollback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = Join-Path '${{ steps.msys.outputs.msys2-location }}' 'mingw64\bin'
          $env:PATH = $toolchain + ';' + $env:PATH
          & .\native\tests\wix-retired-msi-tests.ps1 -ToolchainBin $toolchain -WixExe $env:WIX_EXE -WorkDir "$pwd\build\wix-retired-msi-test"
          if ($LASTEXITCODE -ne 0) { throw 'Locked-file MSI rollback test failed.' }
      - name: Preserve verified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ github.sha }}
          path: windows/dist/platform/release/
          if-no-files-found: error
